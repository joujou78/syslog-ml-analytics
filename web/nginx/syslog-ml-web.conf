# Copy to /etc/nginx/sites-available/syslog-ml-web, symlink into
# sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# Serves the built React app as static files and reverse-proxies /api to
# the FastAPI backend (gunicorn/uvicorn on 127.0.0.1:8000). Replace
# server_name / add TLS (certbot or your own certs) before exposing this
# beyond your internal network -- it's plain HTTP by default, and this
# app handles login credentials and SNMP secrets.

server {
    listen 80;
    server_name _;

    root /opt/syslog-ml/web/frontend/dist;
    index index.html;

    # More specific than the general /api/ block below -- nginx picks the
    # longest matching prefix regardless of declaration order, so this
    # takes precedence for Log Assistant requests specifically. Needs a
    # much longer read timeout than everything else: a local CPU-only LLM
    # chat completion can legitimately take minutes (confirmed on
    # net-flow: ~6s uncontended, but 4+ minutes while something else --
    # e.g. the Log Assistant indexer's own embedding backfill -- is
    # competing for the same CPU). nginx's default proxy_read_timeout
    # (60s) and the backend's own SYSLOG_ML_OLLAMA_TIMEOUT_SECONDS
    # (default 60s, see web/backend/app/core/config.py) were both too
    # tight for this reality -- raise both together, or a request that
    # would have eventually succeeded fails at whichever 60s timeout
    # fires first instead of just being slow.
    location /api/log-assistant/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any non-API, non-file path serves index.html so
    # react-router's client-side routes (e.g. /credentials) work on refresh.
    location / {
        try_files $uri /index.html;
    }
}
