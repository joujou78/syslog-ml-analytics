# Enables rsyslog to actually receive syslog sent over the network from
# other devices (routers, switches, firewalls, etc.) via UDP and TCP port
# 514. Without this, rsyslog only ever sees messages generated locally on
# this VM -- 60-syslog-ml.conf has nothing real to mirror until this is
# in place.
#
# Drop into /etc/rsyslog.d/ (numbered before 60-syslog-ml.conf so the
# listener is up before that file's action runs), then:
#   sudo systemctl restart rsyslog
# and open UDP/TCP 514 in whatever firewall(s) sit in front of this VM
# (see README) -- both the OS firewall (ufw/iptables) and, if this VM is
# hosted rather than on hardware you control, any security-group/network
# ACL layer above the OS.
#
# rsyslogd binds this port while still running as root (before it drops
# to the syslog user), so no special capability setup is needed for the
# privileged port.

module(load="imudp")
input(type="imudp" port="514")

module(load="imtcp")
input(type="imtcp" port="514")
