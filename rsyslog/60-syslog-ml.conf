# Drop into /etc/rsyslog.d/ on the box that receives your syslog feed, then
# `systemctl restart rsyslog`. This is a second, additive output — your
# existing LogAnalyzer pipeline/config is untouched.
#
# Writes one JSON object per line to a local file that the classifier
# service tails. No broker, no network hop: everything stays on this VM.
#
# IMPORTANT: uses `fromhost-ip`, the actual network-level source address of
# the UDP/TCP packet, not the `hostname` field inside the message body.
# Devices can self-report any hostname (or none) in the message; the source
# IP cannot be spoofed on a normal L2/L3 path the way the message body can,
# which is why device identity resolution (device_resolver.py) keys off
# this field and treats the in-message hostname as a secondary hint only.
#
# Scoped to a dedicated ruleset, bound in 10-network-listener.conf's
# input() statements to ONLY the imudp/imtcp listeners on port 514 --
# not this VM's own default ruleset, which (via imuxsock/systemd-journald
# forwarding, always active on Ubuntu) also carries every local
# application's own output: rsyslog would otherwise write net-flow's own
# gunicorn access log and the classifier's own log lines into this same
# file as if they were network device traffic, polluting Log Search with
# self-referential noise that (having perfectly accurate, always-current
# timestamps) crowds out genuine device logs at the top of any recency
# sort. Confirmed this was happening in production: rows with
# hostname=net-flow, source_ip=127.0.0.1, program=gunicorn/python.

# template() is a global object definition, not a rule-level statement --
# it must stay outside the ruleset() block below (which only holds
# actions/logic), unlike action() which can live inside it.
template(name="syslog_ml_json" type="list" option.jsonf="on") {
    property(outname="timestamp"        name="timereported"        dateFormat="rfc3339" format="jsonf")
    property(outname="source_ip"        name="fromhost-ip"                               format="jsonf")
    property(outname="reported_hostname" name="hostname"                                 format="jsonf")
    property(outname="facility"         name="syslogfacility-text"                       format="jsonf")
    property(outname="severity"         name="syslogseverity-text"                       format="jsonf")
    property(outname="program"          name="programname"                               format="jsonf")
    property(outname="pid"              name="procid"                                    format="jsonf")
    property(outname="message"          name="msg"                                       format="jsonf")
    property(outname="raw"              name="rawmsg"                                    format="jsonf")
}

ruleset(name="syslogMlNetwork") {
    action(
        type="omfile"
        file="/var/log/syslog-ml/raw.jsonl"
        template="syslog_ml_json"
        fileCreateMode="0640"
        dirCreateMode="0770"
    )
}

# One deliberate, explicit exception to "network listeners only": snmptrapd
# (see snmptrapd/, if you've set it up) logs traps via the *local* syslog
# socket -Lsd is configured to use -- the same imuxsock/journald path as
# net-flow's own noise, which is exactly what this ruleset split exists to
# keep out. Without this, SNMP traps would silently stop reaching
# raw.jsonl entirely. Allow-listed by program name rather than reopening
# local traffic wholesale, so this doesn't regress back to the
# gunicorn/sudo/systemd pollution the split was built to fix. Runs in the
# DEFAULT ruleset (this isn't inside the ruleset() block above), since
# that's what imuxsock-sourced messages use when nothing else binds them.
if $programname == 'snmptrapd' then {
    call syslogMlNetwork
}
