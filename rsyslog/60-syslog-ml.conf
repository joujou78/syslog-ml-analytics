# Drop into /etc/rsyslog.d/ on the box that receives your syslog feed, then
# `systemctl restart rsyslog`. This is a second, additive output — your
# existing LogAnalyzer pipeline/config is untouched.
#
# Writes one JSON object per line to a local file that the classifier
# service tails. No broker, no network hop: everything stays on this VM.
#
# IMPORTANT: uses `fromhost-ip`, the actual network-level source address of
# the UDP/TCP packet, not the `hostname` field inside the message body.
# Devices can self-report any hostname (or none) in the message; the source
# IP cannot be spoofed on a normal L2/L3 path the way the message body can,
# which is why device identity resolution (device_resolver.py) keys off
# this field and treats the in-message hostname as a secondary hint only.

template(name="syslog_ml_json" type="list" option.jsonf="on") {
    property(outname="timestamp"        name="timereported"        dateFormat="rfc3339" format="jsonf")
    property(outname="source_ip"        name="fromhost-ip"                               format="jsonf")
    property(outname="reported_hostname" name="hostname"                                 format="jsonf")
    property(outname="facility"         name="syslogfacility-text"                       format="jsonf")
    property(outname="severity"         name="syslogseverity-text"                       format="jsonf")
    property(outname="program"          name="programname"                               format="jsonf")
    property(outname="pid"              name="procid"                                    format="jsonf")
    property(outname="message"          name="msg"                                       format="jsonf")
    property(outname="raw"              name="rawmsg"                                    format="jsonf")
}

action(
    type="omfile"
    file="/var/log/syslog-ml/raw.jsonl"
    template="syslog_ml_json"
    fileCreateMode="0640"
    dirCreateMode="0770"
)
